<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 — 陈霆钧</title>
<meta name="description" content="工程笔记：agent 系统的判定机制、任务分解与实验记录。">
<meta property="og:title" content="博客 — 陈霆钧">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#0b0b0c; --ink:#f2ede3; --dim:rgba(242,237,227,.56);
  --faint:rgba(242,237,227,.34); --line:rgba(242,237,227,.14);
  --acid:#d6ff2e;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(214,255,46,.05),transparent 70%)}
::selection{background:var(--acid);color:#0b0b0c}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
.wrap.narrow{max-width:800px}

/* 渐进增强：默认可见。只有 html.js 存在（脚本已运行）才隐藏等待揭示。
   这样即使 JS 报错 / 被禁用 / IntersectionObserver 不支持，内容也不会消失。 */
.reveal{opacity:1;transform:none}
html.js .reveal{opacity:0;transform:translateY(26px);
                transition:opacity .9s ease,transform .9s ease}
html.js .reveal.on{opacity:1;transform:none}
html.js .reveal.d1{transition-delay:.12s}
html.js .reveal.d2{transition-delay:.24s}
html.js .reveal.d3{transition-delay:.36s}

nav{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.78);
    backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
.brand{font-family:var(--serif);font-weight:900;font-size:15px;letter-spacing:.14em;
       text-decoration:none;color:var(--ink)}
.brand i{font-style:normal;color:var(--acid)}
.brand small{font-family:var(--mono);font-weight:400;font-size:10.5px;
             letter-spacing:.16em;color:var(--dim);margin-left:12px}
nav ul{display:flex;gap:30px;list-style:none}
nav a{font-size:12.5px;letter-spacing:.16em;color:var(--dim);text-decoration:none;
      transition:color .25s}
nav a:hover,nav a.on{color:var(--ink)}

/* ── 详情页 ── */
.ph{padding-top:11vh;padding-bottom:7vh;border-bottom:1px solid var(--line)}
.crumb{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
       color:var(--dim);text-decoration:none;transition:color .25s}
.crumb:hover{color:var(--acid)}
.ph h1{font-family:var(--serif);font-weight:900;line-height:1.16;letter-spacing:.01em;
       font-size:clamp(2.3rem,5.6vw,4.4rem);margin:28px 0 0}
.ph h1 em{font-style:normal;color:var(--acid)}
.ph .kind{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;
          color:var(--acid);text-transform:uppercase;margin-top:26px;display:block}
.ph .lede{margin-top:22px;max-width:36em;color:var(--dim);font-size:16px;line-height:1.95}

/* 行动区：在线服务 / 下载 / 代码 */
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:44px}
.act{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;
     font-size:13.5px;letter-spacing:.05em;text-decoration:none;
     border:1px solid var(--faint);color:var(--ink);transition:all .28s}
.act:hover{background:var(--acid);color:#0b0b0c;border-color:var(--acid)}
.act.ghost{border-color:var(--line);color:var(--dim)}
.act.ghost:hover{background:transparent;color:var(--ink);border-color:var(--faint)}
.act small{font-family:var(--mono);font-size:10px;letter-spacing:.1em;opacity:.65}

section{padding-top:9vh;padding-bottom:9vh}
.sec-h{font-family:var(--serif);font-weight:900;letter-spacing:.03em;
       font-size:clamp(1.4rem,2.8vw,2rem);margin-bottom:36px;
       padding-bottom:18px;border-bottom:1px solid var(--line)}
.body-t p{font-size:15.5px;line-height:2.05;color:rgba(242,237,227,.82);margin-bottom:24px}
.body-t strong{color:var(--ink);font-weight:600}
.body-t em{font-style:normal;color:var(--acid)}

/* 规格表 */
.spec{list-style:none}
.spec li{display:grid;grid-template-columns:150px 1fr;gap:24px;
         padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.spec dt,.spec .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;
                  color:var(--dim);padding-top:2px}
.spec .v{color:rgba(242,237,227,.86);line-height:1.7}

/* 三步 / 特性 */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.feat{padding:30px 26px 30px 0;border-right:1px solid var(--line)}
.feat:last-child{border-right:none}
.feat .n{font-family:var(--mono);font-size:11px;color:var(--acid);
         letter-spacing:.16em;margin-bottom:16px}
.feat h3{font-family:var(--serif);font-weight:700;font-size:1.15rem;
         letter-spacing:.03em;margin-bottom:10px}
.feat p{font-size:13.5px;line-height:1.8;color:var(--dim)}

pre{font-family:var(--mono);font-size:12.5px;line-height:1.9;
    background:rgba(242,237,227,.035);border:1px solid var(--line);
    padding:22px 24px;overflow-x:auto;margin:24px 0;color:rgba(242,237,227,.8)}
pre b{color:var(--acid);font-weight:400}

.note{font-size:13px;line-height:1.85;color:var(--dim);
      border-left:2px solid var(--acid);padding-left:20px;margin:28px 0}

.pager{display:flex;justify-content:space-between;flex-wrap:wrap;gap:18px;
       padding:44px 0 0;border-top:1px solid var(--line);margin-top:6vh}
.pager a{font-family:var(--mono);font-size:12px;letter-spacing:.1em;
         color:var(--dim);text-decoration:none;transition:color .25s}
.pager a:hover{color:var(--acid)}

footer{border-top:1px solid var(--line);padding:52px 0;margin-top:10vh}
.colophon{font-family:var(--mono);font-size:10.5px;color:#3d3d42;
          letter-spacing:.12em;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}

@media(max-width:880px){
  .feats{grid-template-columns:1fr}
  .feat{border-right:none;border-bottom:1px solid var(--line);padding-right:0}
  .spec li{grid-template-columns:110px 1fr;gap:16px}
  .reveal{transition-duration:.55s}
}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}


.empty{max-width:560px;margin:0 auto;text-align:center;padding:8vh 0 12vh}
.empty .mark{font-family:var(--mono);font-size:11px;letter-spacing:.2em;
             color:var(--acid);margin-bottom:26px}
.empty p{font-size:15px;line-height:2;color:var(--dim)}
.empty p+p{margin-top:14px}
.badge{display:inline-block;font-family:var(--mono);font-size:10px;
       letter-spacing:.14em;color:var(--acid);border:1px solid rgba(214,255,46,.35);
       padding:3px 9px;margin-left:10px;vertical-align:middle}

</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a href="index.html" class="brand">陈霆钧<i>.</i><small>朝天椒</small></a>
    <ul>
      <li><a href="index.html#work">作品</a></li>
      <li><a href="blog.html">博客</a></li>
      <li><a href="index.html#about">关于</a></li>
    </ul>
  </div>
</nav>
<header class="ph wrap">
  <a class="crumb reveal on" href="index.html">← 首页</a>
  <h1 class="reveal on">工程笔记</h1>
  <span class="kind reveal d1">Writing</span>
  <p class="lede reveal d1">
    关于 agent 系统的判定机制、任务分解，以及实测中遇到的边界条件。
    文章在写，暂未发布。
  </p>
</header>

<section class="wrap">
  <div class="empty reveal d1">
    <div class="mark">暂无文章</div>
    <p>正在整理的几篇：跨 harness 的小模型评测方法、
    为什幺覆盖率判据要做去重、以及中文文档抓取中的编码问题。</p>
    <p style="color:rgba(242,237,227,.34)">
      发布后会在本页列出。也可以先看作品页。</p>
  </div>
  <div class="pager reveal d2" style="max-width:560px;margin:0 auto">
    <a href="index.html#work">← 作品</a>
    <a href="index.html#contact">联系 →</a>
  </div>
</section>

<footer><div class="wrap colophon">
  <span>陈霆钧 · 朝天椒 · 2026</span>
  <span>HTML / CSS — no framework, no tracking</span>
</div></footer>
<script>
(function(){
  document.documentElement.classList.add('js');
  var els=[].slice.call(document.querySelectorAll('.reveal'));
  function showAll(){ els.forEach(function(e){e.classList.add('on')}); }
  if(!('IntersectionObserver' in window)){ showAll(); return; }
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target);} });
  },{threshold:0.05,rootMargin:'0px 0px -2% 0px'});
  els.forEach(function(e){ io.observe(e) });
  setTimeout(showAll, 1500);
})();
</script>
</body>
</html>
