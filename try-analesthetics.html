<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>analesthetics — 在线试用</title>
<meta name="description" content="选一张示例作品，看它提取的指标读数、参考区间，以及被标记的异常项。">
<style>
:root{
  --bg:#0b0b0c; --ink:#f2ede3; --dim:rgba(242,237,227,.56);
  --faint:rgba(242,237,227,.34); --line:rgba(242,237,227,.14);
  --acid:#d6ff2e;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
     -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(214,255,46,.05),transparent 70%)}
::selection{background:var(--acid);color:#0b0b0c}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
.wrap.narrow{max-width:800px}

/* 渐进增强：默认可见。只有 html.js 存在（脚本已运行）才隐藏等待揭示。
   这样即使 JS 报错 / 被禁用 / IntersectionObserver 不支持，内容也不会消失。 */
.reveal{opacity:1;transform:none}
html.js .reveal{opacity:0;transform:translateY(26px);
                transition:opacity .9s ease,transform .9s ease}
html.js .reveal.on{opacity:1;transform:none}
html.js .reveal.d1{transition-delay:.12s}
html.js .reveal.d2{transition-delay:.24s}
html.js .reveal.d3{transition-delay:.36s}

nav{position:sticky;top:0;z-index:50;background:rgba(11,11,12,.78);
    backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
.brand{font-family:var(--serif);font-weight:900;font-size:15px;letter-spacing:.14em;
       text-decoration:none;color:var(--ink)}
.brand i{font-style:normal;color:var(--acid)}
.brand small{font-family:var(--mono);font-weight:400;font-size:10.5px;
             letter-spacing:.16em;color:var(--dim);margin-left:12px}
nav ul{display:flex;gap:30px;list-style:none}
nav a{font-size:12.5px;letter-spacing:.16em;color:var(--dim);text-decoration:none;
      transition:color .25s}
nav a:hover,nav a.on{color:var(--ink)}

/* ── 详情页 ── */
.ph{padding-top:11vh;padding-bottom:7vh;border-bottom:1px solid var(--line)}
.crumb{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
       color:var(--dim);text-decoration:none;transition:color .25s}
.crumb:hover{color:var(--acid)}
.ph h1{font-family:var(--serif);font-weight:900;line-height:1.16;letter-spacing:.01em;
       font-size:clamp(2.3rem,5.6vw,4.4rem);margin:28px 0 0}
.ph h1 em{font-style:normal;color:var(--acid)}
.ph .kind{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;
          color:var(--acid);text-transform:uppercase;margin-top:26px;display:block}
.ph .lede{margin-top:22px;max-width:36em;color:var(--dim);font-size:16px;line-height:1.95}

/* 行动区：在线服务 / 下载 / 代码 */
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:44px}
.act{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;
     font-size:13.5px;letter-spacing:.05em;text-decoration:none;
     border:1px solid var(--faint);color:var(--ink);transition:all .28s}
.act:hover{background:var(--acid);color:#0b0b0c;border-color:var(--acid)}
.act.ghost{border-color:var(--line);color:var(--dim)}
.act.ghost:hover{background:transparent;color:var(--ink);border-color:var(--faint)}
.act small{font-family:var(--mono);font-size:10px;letter-spacing:.1em;opacity:.65}

section{padding-top:9vh;padding-bottom:9vh}
.sec-h{font-family:var(--serif);font-weight:900;letter-spacing:.03em;
       font-size:clamp(1.4rem,2.8vw,2rem);margin-bottom:36px;
       padding-bottom:18px;border-bottom:1px solid var(--line)}
.body-t p{font-size:15.5px;line-height:2.05;color:rgba(242,237,227,.82);margin-bottom:24px}
.body-t strong{color:var(--ink);font-weight:600}
.body-t em{font-style:normal;color:var(--acid)}

/* 规格表 */
.spec{list-style:none}
.spec li{display:grid;grid-template-columns:150px 1fr;gap:24px;
         padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.spec dt,.spec .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;
                  color:var(--dim);padding-top:2px}
.spec .v{color:rgba(242,237,227,.86);line-height:1.7}

/* 三步 / 特性 */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.feat{padding:30px 26px 30px 0;border-right:1px solid var(--line)}
.feat:last-child{border-right:none}
.feat .n{font-family:var(--mono);font-size:11px;color:var(--acid);
         letter-spacing:.16em;margin-bottom:16px}
.feat h3{font-family:var(--serif);font-weight:700;font-size:1.15rem;
         letter-spacing:.03em;margin-bottom:10px}
.feat p{font-size:13.5px;line-height:1.8;color:var(--dim)}

pre{font-family:var(--mono);font-size:12.5px;line-height:1.9;
    background:rgba(242,237,227,.035);border:1px solid var(--line);
    padding:22px 24px;overflow-x:auto;margin:24px 0;color:rgba(242,237,227,.8)}
pre b{color:var(--acid);font-weight:400}

.note{font-size:13px;line-height:1.85;color:var(--dim);
      border-left:2px solid var(--acid);padding-left:20px;margin:28px 0}

.pager{display:flex;justify-content:space-between;flex-wrap:wrap;gap:18px;
       padding:44px 0 0;border-top:1px solid var(--line);margin-top:6vh}
.pager a{font-family:var(--mono);font-size:12px;letter-spacing:.1em;
         color:var(--dim);text-decoration:none;transition:color .25s}
.pager a:hover{color:var(--acid)}

footer{border-top:1px solid var(--line);padding:52px 0;margin-top:10vh}
.colophon{font-family:var(--mono);font-size:10.5px;color:#3d3d42;
          letter-spacing:.12em;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}

@media(max-width:880px){
  .feats{grid-template-columns:1fr}
  .feat{border-right:none;border-bottom:1px solid var(--line);padding-right:0}
  .spec li{grid-template-columns:110px 1fr;gap:16px}
  .reveal{transition-duration:.55s}
}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}


.badge{display:inline-block;font-family:var(--mono);font-size:9.5px;
       letter-spacing:.14em;color:var(--acid);border:1px solid rgba(214,255,46,.35);
       padding:2px 7px;margin-left:9px;vertical-align:middle;white-space:nowrap}
.wipbar{border:1px solid rgba(214,255,46,.28);
        background:rgba(214,255,46,.05);
        padding:14px 20px;margin:0 auto 0;max-width:800px;
        font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
        color:rgba(242,237,227,.7);text-align:center}
.wipbar b{color:var(--acid);font-weight:400}

</style>
<style>
.demo{padding-top:8vh;padding-bottom:12vh}
.dlabel{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
        color:var(--dim);text-transform:uppercase;margin-bottom:10px;display:block}
.dinput,.darea,.dsel{width:100%;background:rgba(242,237,227,.035);
  border:1px solid var(--line);color:var(--ink);font-family:var(--sans);
  font-size:14px;padding:14px 16px;outline:none;transition:border-color .25s}
.dinput:focus,.darea:focus,.dsel:focus{border-color:var(--faint)}
.darea{min-height:170px;resize:vertical;line-height:1.8;font-family:var(--mono);font-size:12.5px}
.dfield{margin-bottom:26px}
.drow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}
.dbtn{padding:13px 28px;background:var(--acid);color:#0b0b0c;border:none;
  font-family:var(--sans);font-size:13.5px;letter-spacing:.05em;cursor:pointer;
  transition:transform .2s,opacity .2s}
.dbtn:hover{transform:translateY(-1px)}
.dbtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.dbtn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.dbtn.ghost:hover{color:var(--ink);border-color:var(--faint)}

.out{margin-top:44px;border-top:1px solid var(--line);padding-top:34px;display:none}
.out.on{display:block}
.log{font-family:var(--mono);font-size:12.5px;line-height:2;color:var(--dim)}
.log b{color:var(--acid);font-weight:400}
.log .ok{color:var(--acid)}
.log .no{color:#ff5c5c}
.bar{display:inline-block;height:3px;background:var(--line);width:140px;
     vertical-align:middle;margin-left:10px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acid);width:0;
       transition:width .5s ease}

.dtable{width:100%;border-collapse:collapse;margin-top:20px;font-size:13px}
.dtable th,.dtable td{border-bottom:1px solid var(--line);padding:11px 10px;
                      text-align:left}
.dtable th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
           color:var(--dim);font-weight:400}
.dtable td{color:rgba(242,237,227,.85)}
.dtable td.miss{color:#ff5c5c}

.metric{margin-bottom:16px}
.metric-h{display:flex;justify-content:space-between;font-family:var(--mono);
          font-size:11.5px;color:var(--dim);margin-bottom:7px}
.metric-h b{color:var(--ink);font-weight:400}
.mtrack{height:4px;background:rgba(242,237,227,.09);position:relative}
.mtrack i{position:absolute;top:0;bottom:0;background:var(--dim)}
.mtrack i.bad{background:#ff5c5c}
.mtrack i.good{background:var(--acid)}
.mtrack .tick{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--faint)}
.mnote{font-size:12.5px;color:var(--dim);margin-top:4px}

#shapeWrap{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.shape{width:74px;height:74px;border:1px solid var(--line);display:flex;
       align-items:center;justify-content:center;cursor:pointer;transition:all .22s;
       background:rgba(242,237,227,.02)}
.shape:hover{border-color:var(--faint)}
.shape.on{border-color:var(--acid);background:rgba(214,255,46,.07)}
.shape svg{width:46px;height:46px;fill:rgba(242,237,227,.5)}
.shape.on svg{fill:var(--acid)}
#cvOut{margin-top:26px;border:1px solid var(--line);background:#000;max-width:100%}
</style>
<script>document.documentElement.classList.add("js");</script>
</head>
<body>
<nav>
  <div class="wrap">
    <a href="index.html" class="brand">陈霆钧<i>.</i><small>朝天椒</small></a>
    <ul>
      <li><a href="index.html#work">作品</a></li>
      <li><a href="blog.html">博客</a></li>
      <li><a href="index.html#about">关于</a></li>
    </ul>
  </div>
</nav>
<header class="ph wrap">
  <a class="crumb reveal on" href="analesthetics.html">← analesthetics</a>
  <h1 class="reveal on">绘画诊断</h1>
  <span class="kind reveal d1">在线试用 · DEMO</span>
  <p class="lede reveal d1">选一张示例作品，看它提取的指标读数、参考区间，以及被标记的异常项。</p>
</header>
<div class="wipbar reveal">该页面为<b>前端演示</b>，后端服务<b>尚未开发</b> —— 界面中的计算均在浏览器本地完成，不代表真实系统性能</div>
<section class="demo wrap narrow">

<div class="dfield reveal">
  <label class="dlabel">选择示例作品</label>
  <select class="dsel" id="pick">
    <option value="a">示例 A —— 色彩层级偏离</option>
    <option value="b">示例 B —— 形状复杂度偏离</option>
  </select>
</div>
<div class="drow reveal d1">
  <button class="dbtn" id="run">运行诊断</button>
</div>
<div class="out wrap" id="out">
  <div class="log" id="log"></div>
  <div id="metrics" style="margin-top:26px"></div>
</div>

</section>
<footer><div class="wrap colophon">
  <span>陈霆钧 · 朝天椒 · 2026</span>
  <span>前端演示 — 计算在本地模拟，不含真实后端</span>
</div></footer>

<script>
const DATA = {
  a: {n:'示例 A', total:21, bad:7, items:[
    ['主色占比','0.875','bad','参考 0.436 – 0.703','色彩过于集中，缺次级色'],
    ['次色占比','0.108','bad','参考 0.247 – 0.386','层次不足'],
    ['点缀色占比','0.017','bad','参考 0.072 – 0.236','几乎没有点缀'],
    ['明度熵','5.62','ok','参考 5.55 – 5.88','正常'],
    ['疏密比 L1','0.116','ok','参考 0.09 – 0.13','正常'],
    ['边缘密度','0.241','ok','参考 0.19 – 0.29','正常'],
  ]},
  b: {n:'示例 B', total:21, bad:9, items:[
    ['周长归一','15.55','bad','参考 5.57 – 8.95','轮廓远比参考破碎'],
    ['曲率标准差','0.563','bad','参考 0.347 – 0.505','转角过多'],
    ['密度熵','5.783','bad','参考 5.96 – 6.66','分布偏单一'],
    ['主色占比','0.612','ok','参考 0.436 – 0.703','正常'],
    ['明度熵','5.71','ok','参考 5.55 – 5.88','正常'],
    ['形状完整度','0.79','ok','参考 0.72 – 0.86','正常'],
  ]}
};

document.getElementById('run').onclick = async () => {
  const k = document.getElementById('pick').value;
  const d = DATA[k];
  const out = document.getElementById('out');
  const log = document.getElementById('log');
  const m = document.getElementById('metrics');
  out.classList.add('on'); m.innerHTML=''; log.innerHTML='';

  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  log.innerHTML += '载入作品 …<br>'; await sleep(350);
  log.innerHTML += '提取指标 <b>' + d.total + '</b> 项<br>'; await sleep(450);
  log.innerHTML += '与 60 张参考作品分布对比 …<br>'; await sleep(500);
  log.innerHTML += '标记异常项：<span style="color:#ff5c5c">' + d.bad + ' / ' + d.total + '</span><br>';

  for(const [name, val, st, ref, note] of d.items){
    const pct = Math.min(100, Math.random()*40 + 30);
    m.innerHTML += `
      <div class="metric">
        <div class="metric-h"><span>${name}</span><b>${val}</b></div>
        <div class="mtrack"><i class="${st}" style="width:${pct}%"></i></div>
        <div class="mnote">${ref} · ${note}</div>
      </div>`;
    await sleep(110);
  }
};
</script>

<script>
(function(){
  document.documentElement.classList.add('js');
  var els=[].slice.call(document.querySelectorAll('.reveal'));
  function showAll(){ els.forEach(function(e){e.classList.add('on')}); }
  if(!('IntersectionObserver' in window)){ showAll(); return; }
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target);} });
  },{threshold:0.05,rootMargin:'0px 0px -2% 0px'});
  els.forEach(function(e){ io.observe(e) });
  setTimeout(showAll, 1500);
})();
</script>
</body>
</html>
